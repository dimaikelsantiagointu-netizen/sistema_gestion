{% if messages %}
<div class="mb-6 space-y-3">
    {% for message in messages %}
    <div class="rounded-2xl border px-5 py-4 text-sm font-bold {% if message.tags == 'success' %}border-emerald-200 bg-emerald-50 text-emerald-800{% elif message.tags == 'error' %}border-red-200 bg-red-50 text-red-800{% else %}border-blue-200 bg-blue-50 text-blue-800{% endif %}" role="alert">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
