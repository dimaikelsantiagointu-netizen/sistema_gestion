<div class="mb-8 flex flex-wrap items-center justify-end gap-4">
    <nav class="flex flex-wrap gap-2">
        <a href="{% url 'gestion_documental:dashboard' %}" class="rounded-xl px-4 py-2 text-[10px] font-black uppercase tracking-widest {% if request.resolver_match.url_name == 'dashboard' %}bg-intu-blue text-white{% else %}bg-white text-slate-500 hover:text-intu-blue{% endif %}">Resumen</a>
        <a href="{% url 'gestion_documental:lista' %}" class="rounded-xl px-4 py-2 text-[10px] font-black uppercase tracking-widest {% if request.resolver_match.url_name == 'lista' %}bg-intu-blue text-white{% else %}bg-white text-slate-500 hover:text-intu-blue{% endif %}">Expedientes</a>
        <a href="{% url 'gestion_documental:crear' %}" class="rounded-xl bg-intu-red px-4 py-2 text-[10px] font-black uppercase tracking-widest text-white hover:bg-red-800">Nuevo registro</a>
        {% if perms.users.gestionar_catalogos_documentales or user.is_superuser %}
        <a href="{% url 'gestion_documental:titulares' %}" class="rounded-xl px-4 py-2 text-[10px] font-black uppercase tracking-widest {% if 'titular' in request.path %}bg-intu-blue text-white{% else %}bg-white text-slate-500 hover:text-intu-blue{% endif %}">Titulares</a>
        <a href="{% url 'gestion_documental:estatus' %}" class="rounded-xl px-4 py-2 text-[10px] font-black uppercase tracking-widest {% if 'estatus' in request.path %}bg-intu-blue text-white{% else %}bg-white text-slate-500 hover:text-intu-blue{% endif %}">Estatus</a>
        {% endif %}
    </nav>
</div>
